repos:
  # General file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: detect-private-key
      - id: check-merge-conflict

  # Ruff — fix + format + re-stage in one pass so the commit always includes fixes
  - repo: local
    hooks:
      - id: ruff-fix-and-format
        name: ruff (fix + format + re-stage)
        language: system
        entry: >-
          bash -c '
            ruff check --fix "$@";
            FIX_EXIT=$?;
            ruff format "$@";
            git add "$@";
            exit $FIX_EXIT
          ' --
        types: [python]
        pass_filenames: true
