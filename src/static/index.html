<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VoiceBuddy — CoolBreeze HVAC</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #1a1a2e; color: #e0e0e0;
    display: flex; justify-content: center; align-items: flex-start;
    min-height: 100vh; padding: 2rem;
  }
  .card {
    background: #16213e; border-radius: 12px; padding: 2rem;
    width: 480px; box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  }
  h1 { font-size: 1.4rem; margin-bottom: 0.3rem; text-align: center; }
  .subtitle { font-size: 0.8rem; color: #888; text-align: center; margin-bottom: 1.2rem; }
  .status {
    display: flex; align-items: center; gap: 0.5rem;
    margin-bottom: 1rem; font-size: 0.9rem;
  }
  .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: #555; flex-shrink: 0;
  }
  .dot.connected { background: #4caf50; }
  .dot.streaming { background: #ff9800; animation: pulse 1s infinite; }
  .dot.speaking { background: #2196f3; animation: pulse 0.6s infinite; }
  @keyframes pulse { 50% { opacity: 0.4; } }
  .stats {
    display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem;
    margin-bottom: 1rem;
  }
  .stat { background: #0f3460; border-radius: 8px; padding: 0.7rem; text-align: center; }
  .stat .label { font-size: 0.7rem; text-transform: uppercase; color: #888; }
  .stat .value { font-size: 1.1rem; font-weight: bold; margin-top: 0.2rem; }

  /* Conversation thread */
  .conversation {
    background: #0d1b36; border-radius: 8px; padding: 1rem;
    margin-bottom: 1rem; max-height: 300px; overflow-y: auto;
    font-size: 0.85rem; line-height: 1.5;
  }
  .conversation:empty::before {
    content: "Speak to start a conversation...";
    color: #555; font-style: italic;
  }
  .msg { margin-bottom: 0.6rem; padding: 0.5rem 0.7rem; border-radius: 6px; }
  .msg.user { background: #1a3a5c; border-left: 3px solid #ff9800; }
  .msg.filler { background: #1a2a3c; border-left: 3px solid #666; font-style: italic; color: #aaa; }
  .msg.assistant { background: #1a2a4c; border-left: 3px solid #4caf50; }
  .msg .role { font-size: 0.7rem; text-transform: uppercase; color: #888; margin-bottom: 0.2rem; }
  .msg .text { word-wrap: break-word; }

  /* Live transcript */
  .live-transcript {
    background: #0f3460; border-radius: 8px; padding: 0.7rem;
    margin-bottom: 1rem; min-height: 2rem;
    font-size: 0.85rem; color: #ff9800; font-style: italic;
  }
  .live-transcript:empty::before {
    content: "Listening...";
    color: #444;
  }

  .buttons { display: flex; gap: 0.8rem; }
  button {
    flex: 1; padding: 0.7rem; border: none; border-radius: 8px;
    font-size: 1rem; font-weight: 600; cursor: pointer;
    transition: opacity 0.2s;
  }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  #startBtn { background: #4caf50; color: #fff; }
  #stopBtn { background: #f44336; color: #fff; }
</style>
</head>
<body>
<div class="card">
  <h1>CoolBreeze HVAC</h1>
  <div class="subtitle">Voice Assistant — Allison</div>
  <div class="status">
    <div class="dot" id="statusDot"></div>
    <span id="statusText">Disconnected</span>
  </div>
  <div class="stats">
    <div class="stat">
      <div class="label">Ping RTT</div>
      <div class="value" id="rttValue">-- ms</div>
    </div>
    <div class="stat">
      <div class="label">State</div>
      <div class="value" id="stateValue">IDLE</div>
    </div>
  </div>
  <div class="live-transcript" id="liveTranscript"></div>
  <div class="conversation" id="conversation"></div>
  <div class="buttons">
    <button id="startBtn">Start</button>
    <button id="stopBtn" disabled>Stop</button>
  </div>
</div>

<script>
(() => {
  // --- Config ---
  const TARGET_SAMPLE_RATE = 16000;
  const CHUNK_SAMPLES = 320;           // 20ms at 16kHz
  const CHUNK_BYTES = CHUNK_SAMPLES * 2; // 640 bytes (Int16)
  const PING_INTERVAL_MS = 2000;
  const JITTER_BUFFER_MS = 40;
  const RTT_WINDOW = 10;

  // --- DOM refs ---
  const startBtn = document.getElementById("startBtn");
  const stopBtn = document.getElementById("stopBtn");
  const statusDot = document.getElementById("statusDot");
  const statusText = document.getElementById("statusText");
  const rttValue = document.getElementById("rttValue");
  const stateValue = document.getElementById("stateValue");
  const liveTranscript = document.getElementById("liveTranscript");
  const conversation = document.getElementById("conversation");

  // --- State ---
  let ws = null;
  let micStream = null;
  let captureCtx = null;
  let playbackCtx = null;
  let workletNode = null;
  let pingInterval = null;
  let rttSamples = [];
  let nextPlayTime = 0;

  // --- AudioWorklet processor code (inline via Blob URL) ---
  const workletCode = `
class DownsampleProcessor extends AudioWorkletProcessor {
  constructor() {
    super();
    this.buffer = new Float32Array(0);
    this.inputRate = sampleRate;
    this.outputRate = 16000;
    this.ratio = this.inputRate / this.outputRate;
    this.outputChunkSize = 320;
  }

  process(inputs, outputs, parameters) {
    const input = inputs[0];
    if (!input || !input[0]) return true;

    const inputData = input[0];

    const newBuf = new Float32Array(this.buffer.length + inputData.length);
    newBuf.set(this.buffer);
    newBuf.set(inputData, this.buffer.length);
    this.buffer = newBuf;

    const inputNeeded = Math.ceil(this.outputChunkSize * this.ratio);

    while (this.buffer.length >= inputNeeded) {
      const output = new Float32Array(this.outputChunkSize);
      for (let i = 0; i < this.outputChunkSize; i++) {
        const srcIdx = i * this.ratio;
        const floor = Math.floor(srcIdx);
        const ceil = Math.min(floor + 1, this.buffer.length - 1);
        const frac = srcIdx - floor;
        output[i] = this.buffer[floor] * (1 - frac) + this.buffer[ceil] * frac;
      }

      const pcm = new Int16Array(this.outputChunkSize);
      for (let i = 0; i < this.outputChunkSize; i++) {
        const s = Math.max(-1, Math.min(1, output[i]));
        pcm[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
      }

      this.port.postMessage(pcm.buffer, [pcm.buffer]);
      this.buffer = this.buffer.slice(inputNeeded);
    }

    return true;
  }
}

registerProcessor("downsample-processor", DownsampleProcessor);
`;

  // --- Helpers ---
  function setStatus(text, cls) {
    statusText.textContent = text;
    statusDot.className = "dot" + (cls ? " " + cls : "");
  }

  function updateRtt(ms) {
    rttSamples.push(ms);
    if (rttSamples.length > RTT_WINDOW) rttSamples.shift();
    const avg = rttSamples.reduce((a, b) => a + b, 0) / rttSamples.length;
    rttValue.textContent = avg.toFixed(1) + " ms";
  }

  function addMessage(role, text) {
    const div = document.createElement("div");
    div.className = "msg " + role;
    div.innerHTML = `<div class="role">${role === "user" ? "You" : role === "filler" ? "Allison (thinking)" : "Allison"}</div><div class="text">${escapeHtml(text)}</div>`;
    conversation.appendChild(div);
    conversation.scrollTop = conversation.scrollHeight;
  }

  function escapeHtml(s) {
    const d = document.createElement("div");
    d.textContent = s;
    return d.innerHTML;
  }

  // --- Playback ---
  function stopPlayback() {
    if (playbackCtx) {
      playbackCtx.close();
      playbackCtx = new AudioContext({ sampleRate: 48000 });
    }
    nextPlayTime = 0;
  }

  function playPcmChunk(int16Array) {
    if (!playbackCtx) return;

    const floats = new Float32Array(int16Array.length);
    for (let i = 0; i < int16Array.length; i++) {
      floats[i] = int16Array[i] / (int16Array[i] < 0 ? 0x8000 : 0x7FFF);
    }

    const buf = playbackCtx.createBuffer(1, floats.length, TARGET_SAMPLE_RATE);
    buf.getChannelData(0).set(floats);

    const src = playbackCtx.createBufferSource();
    src.buffer = buf;
    src.connect(playbackCtx.destination);

    const now = playbackCtx.currentTime;
    if (nextPlayTime < now) {
      nextPlayTime = now + JITTER_BUFFER_MS / 1000;
    }
    src.start(nextPlayTime);
    nextPlayTime += buf.duration;
  }

  // --- Start ---
  async function start() {
    startBtn.disabled = true;
    rttSamples = [];
    nextPlayTime = 0;
    rttValue.textContent = "-- ms";
    stateValue.textContent = "IDLE";
    liveTranscript.textContent = "";
    conversation.innerHTML = "";

    try {
      captureCtx = new AudioContext({ sampleRate: 48000 });
      playbackCtx = new AudioContext({ sampleRate: 48000 });

      micStream = await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true,
        },
      });

      const blob = new Blob([workletCode], { type: "application/javascript" });
      const workletUrl = URL.createObjectURL(blob);
      await captureCtx.audioWorklet.addModule(workletUrl);
      URL.revokeObjectURL(workletUrl);

      const micSource = captureCtx.createMediaStreamSource(micStream);
      workletNode = new AudioWorkletNode(captureCtx, "downsample-processor");
      micSource.connect(workletNode);
      workletNode.connect(captureCtx.destination);

      const wsProto = location.protocol === "https:" ? "wss:" : "ws:";
      ws = new WebSocket(wsProto + "//" + location.host + "/ws");
      ws.binaryType = "arraybuffer";

      ws.onopen = () => {
        setStatus("Connected — listening", "streaming");
        stopBtn.disabled = false;

        workletNode.port.onmessage = (e) => {
          if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(e.data);
          }
        };

        pingInterval = setInterval(() => {
          if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ type: "ping", t: performance.now() }));
          }
        }, PING_INTERVAL_MS);
      };

      ws.onmessage = (e) => {
        if (e.data instanceof ArrayBuffer) {
          // Binary frame — TTS audio (raw PCM Int16)
          const int16 = new Int16Array(e.data);
          playPcmChunk(int16);
          setStatus("Playing response", "speaking");
          stateValue.textContent = "SPEAKING";
        } else {
          // Text frame — JSON control message
          try {
            const msg = JSON.parse(e.data);

            if (msg.type === "pong" && msg.t != null) {
              updateRtt(performance.now() - msg.t);

            } else if (msg.type === "transcript_partial") {
              liveTranscript.textContent = msg.text;
              setStatus("Listening...", "streaming");
              stateValue.textContent = "LISTENING";

            } else if (msg.type === "transcript") {
              liveTranscript.textContent = "";
              if (msg.text) {
                addMessage("user", msg.text);
              }
              setStatus("Processing...", "connected");
              stateValue.textContent = "PROCESSING";

            } else if (msg.type === "filler") {
              addMessage("filler", msg.text);

            } else if (msg.type === "response") {
              addMessage("assistant", msg.text);

            } else if (msg.type === "playback_done") {
              setStatus("Connected — listening", "streaming");
              stateValue.textContent = "IDLE";
              nextPlayTime = 0; // Reset jitter buffer for next turn

            } else if (msg.type === "stop_playback") {
              stopPlayback();
              setStatus("Connected — listening", "streaming");
              stateValue.textContent = "LISTENING";
              liveTranscript.textContent = "";
            }
          } catch (err) {
            console.warn("Bad JSON from server:", err);
          }
        }
      };

      ws.onclose = () => {
        setStatus("Disconnected", "");
        stateValue.textContent = "IDLE";
        cleanup();
      };

      ws.onerror = (err) => {
        console.error("WebSocket error:", err);
        setStatus("Error", "");
        cleanup();
      };

    } catch (err) {
      console.error("Start failed:", err);
      setStatus("Error: " + err.message, "");
      cleanup();
    }
  }

  // --- Stop / Cleanup ---
  function cleanup() {
    if (pingInterval) { clearInterval(pingInterval); pingInterval = null; }
    if (workletNode) { workletNode.disconnect(); workletNode = null; }
    if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
    if (captureCtx) { captureCtx.close(); captureCtx = null; }
    if (playbackCtx) { playbackCtx.close(); playbackCtx = null; }
    if (ws && ws.readyState <= WebSocket.OPEN) { ws.close(); }
    ws = null;
    startBtn.disabled = false;
    stopBtn.disabled = true;
  }

  function stop() {
    setStatus("Disconnected", "");
    cleanup();
  }

  // --- Wire up buttons ---
  startBtn.addEventListener("click", start);
  stopBtn.addEventListener("click", stop);
})();
</script>
</body>
</html>
