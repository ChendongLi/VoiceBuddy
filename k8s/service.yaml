apiVersion: v1
kind: Service
metadata:
  name: voicebuddy-service
  namespace: voicebuddy
  annotations:
    cloud.google.com/backend-config: '{"default": "voicebuddy-backend-config"}'
spec:
  selector:
    app: voicebuddy
  type: NodePort
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8765
