apiVersion: v1
kind: Service
metadata:
  name: voicebuddy-service
  namespace: voicebuddy
  annotations:
    cloud.google.com/backend-config: '{"default": "voicebuddy-backend-config"}'
spec:
  selector:
    app: voicebuddy
  type: NodePort
  ports:
    - name: http-twilio
      protocol: TCP
      port: 80
      targetPort: 8766   # aiohttp: /incoming-call, /twilio-media, /health
    - name: ws-browser
      protocol: TCP
      port: 8765
      targetPort: 8765   # websockets: browser UI /ws
