apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: voicebuddy-ingress
  namespace: voicebuddy
  annotations:
    kubernetes.io/ingress.class: "gce"
    networking.gke.io/managed-certificates: "voicebuddy-cert"
    kubernetes.io/ingress.allow-http: "true"
    kubernetes.io/ingress.global-static-ip-name: "voicebuddy-static"
spec:
  rules:
  - host: voicebuddy.agentlens.net
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: voicebuddy-service
            port:
              number: 80
