[tool.poetry]
name = "voicebuddy"
version = "0.1.0"
description = "Real-time voice assistant combining Deepgram, Claude, and Cartesia"
authors = ["VoiceBuddy Team <team@example.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
anthropic = "^0.77.1"
deepgram-sdk = "^5.3.2"
cartesia = "^2.0.17"
httpx = "^0.28.1"
websockets = "^16.0"
sounddevice = "~0.5.5"
numpy = "^2.2.4"
pydub = "^0.25.1"
python-dotenv = "^1.2.1"
pydantic = "^2.12.5"
silero-vad = "^5.1"
twilio = "^9.0"
PyYAML = "^6.0"
onnxruntime = "^1.16"
aiosqlite = "^0.20.0"  # SQLite driver for local dev (no Docker needed)
sqlalchemy = {version = "^2.0", extras = ["asyncio"]}
asyncpg = "^0.31"
alembic = "^1.16"
pytz = "^2024.1"
aiohttp = "^3.9"
google-auth = ">=2.0"
google-auth-oauthlib = ">=1.0"
google-api-python-client = ">=2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
ruff = "^0.8.0"
mypy = "^1.8.0"
greenlet = "^3.3.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "strict"
addopts = "-m 'not integration'"  # skip integration tests by default; run with -m integration
markers = [
    "integration: tests that bind real TCP ports and require network",
]

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 120

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
